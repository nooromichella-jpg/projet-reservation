<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation avec lien Accueil -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-bus"></i> VoyageReserve</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fas fa-home"></i> Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="#"><i class="fas fa-chart-bar"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/" target="_blank"><i class="fas fa-eye"></i> Voir le site</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-danger" href="index.html"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <h2><i class="fas fa-chart-bar"></i> Dashboard</h2>
        
        <!-- Statistiques -->
        <div class="row g-4 my-4" id="statsCards">
            <div class="col-md-4">
                <div class="card bg-primary text-white shadow">
                    <div class="card-body">
                        <h5><i class="fas fa-bus"></i> Voyages total</h5>
                        <h2 id="totalVoyages" class="display-4">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white shadow">
                    <div class="card-body">
                        <h5><i class="fas fa-ticket"></i> Réservations</h5>
                        <h2 id="totalReservations" class="display-4">0</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-warning text-dark shadow">
                    <div class="card-body">
                        <h5><i class="fas fa-calendar-day"></i> Aujourd'hui</h5>
                        <h2 id="reservationsToday" class="display-4">0</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bouton Retour Accueil -->
        <div class="text-center mb-3">
            <a href="/" class="btn btn-primary">
                <i class="fas fa-home"></i> Retour à l'accueil
            </a>
        </div>

        <!-- Liste des réservations -->
        <div class="card shadow">
            <div class="card-header bg-dark text-white">
                <h5><i class="fas fa-list"></i> Toutes les réservations</h5>
            </div>
            <div class="card-body">
                <div id="reservationsList">
                    <p class="text-center text-muted">Chargement des réservations...</p>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 VoyageReserve - Projet d'examen</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
