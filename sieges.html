<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sélection des sièges</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .siege {
            width: 50px;
            height: 50px;
            margin: 5px;
            border: 2px solid #0d6efd;
            border-radius: 8px;
            background: white;
            font-weight: bold;
            transition: all 0.3s;
        }
        .siege.disponible:hover {
            background: #0d6efd;
            color: white;
            cursor: pointer;
            transform: scale(1.1);
        }
        .siege.occupe {
            background: #dc3545;
            color: white;
            border-color: #dc3545;
            cursor: not-allowed;
        }
        .siege.selectionne {
            background: #198754;
            color: white;
            border-color: #198754;
        }
        .plan-voyage {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            justify-items: center;
            margin: 20px 0;
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-color {
            width: 25px;
            height: 25px;
            border-radius: 5px;
        }
        .legend-color.disponible { background: white; border: 2px solid #0d6efd; }
        .legend-color.occupe { background: #dc3545; }
        .legend-color.selectionne { background: #198754; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-bus"></i> VoyageReserve</a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm">
                    <i class="fas fa-home"></i> Accueil
                </a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center mb-4"><i class="fas fa-chair"></i> Sélectionnez votre siège</h2>
        
        <div class="card shadow">
            <div class="card-body">
                <div id="voyageInfo" class="text-center mb-3">
                    <h4 id="destinationDisplay"></h4>
                    <p id="voyageDetails"></p>
                </div>

                <div id="siegesContainer">
                    <div class="plan-voyage" id="siegesGrid">
                        <!-- Les sièges seront générés dynamiquement -->
                    </div>
                </div>

                <div class="legend">
                    <div class="legend-item">
                        <div class="legend-color disponible"></div>
                        <span>Disponible</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color occupe"></div>
                        <span>Occupé</span>
                    </div>
                    <div class="legend-item">
                        <div class="legend-color selectionne"></div>
                        <span>Sélectionné</span>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button id="confirmerBtn" class="btn btn-success btn-lg" disabled>
                        <i class="fas fa-check"></i> Confirmer la réservation
                    </button>
                    <a href="/reservation.html" class="btn btn-secondary btn-lg ms-2">
                        <i class="fas fa-arrow-left"></i> Retour
                    </a>
                    <a href="/" class="btn btn-outline-primary btn-lg ms-2">
                        <i class="fas fa-home"></i> Accueil
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 VoyageReserve</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sieges.js"></script>
</body>
</html>
