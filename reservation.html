<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réserver un voyage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="fas fa-bus"></i> VoyageReserve</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/reservation.html">Réserver</a></li>
                    <li class="nav-item"><a class="nav-link" href="/historique.html">Historique</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/index.html">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center mb-4"><i class="fas fa-ticket"></i> Réservation de voyage</h2>
        
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-body">
                        <form id="reservationForm">
                            <div class="mb-3">
                                <label for="voyageSelect" class="form-label">Choisissez votre voyage</label>
                                <select id="voyageSelect" class="form-select" required>
                                    <option value="">Sélectionnez un voyage...</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="nomClient" class="form-label">Nom complet</label>
                                <input type="text" id="nomClient" class="form-control" placeholder="Votre nom" required>
                            </div>

                            <div class="mb-3">
                                <label for="emailClient" class="form-label">Email</label>
                                <input type="email" id="emailClient" class="form-control" placeholder="votre@email.com" required>
                            </div>

                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-arrow-right"></i> Choisir mon siège
                            </button>
                            <a href="/" class="btn btn-secondary w-100 mt-2">
                                <i class="fas fa-arrow-left"></i> Retour à l'accueil
                            </a>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 VoyageReserve</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/reservation.js"></script>
</body>
</html>
